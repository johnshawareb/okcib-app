//   ?source=    lead-source tag (default: form.source)
const params = new URLSearchParams(window.location.search);
const CONFIG_URL = params.get('config') || 'forms.config.json';
const FORM_ID = params.get('form') || document.body.dataset.formId;

const embeddedConfig = () => {
  const el = document.getElementById('embedded-config');
  try { return el ? JSON.parse(el.textContent) : null; } catch (e) { return null; }
};

const findForm = (config, id) => (config?.forms || []).find(f => f.id === id && f.renderer === 'schema' && f.steps);

async function loadConfig() {
  // Prefer the shared config file; fall back to the embedded copy when it isn't
  // reachable (dropped in alone, opened from disk, CORS).
  try {
    const res = await fetch(CONFIG_URL);
    if (res.ok) {
      const config = await res.json();
      if (findForm(config, FORM_ID)) return { config, from: CONFIG_URL };
    }
  } catch (e) { /* fall through to embedded */ }

  const config = embeddedConfig();
  if (findForm(config, FORM_ID)) return { config, from: 'embedded' };
  return null;
}

// Declarative showIf from the config, on a field or a whole step:
//   { field, equals: [...] }   → shown when the field's value is one of these
//   { field, includes: "..." } → shown when the multi-select field contains this
const isVisible = (item, form) => {
  const c = item.showIf;
  if (!c) return true;
  const v = form[c.field];
  if (c.includes !== undefined) return Array.isArray(v) && v.includes(c.includes);
  return (c.equals || []).includes(v);
};

const defaultsFor = (schema) => {
  const out = {};
  schema.steps.forEach(s => s.fields.forEach(f => {
    if (!f.name || out[f.name] !== undefined) return;
    out[f.name] = f.kind === 'multi' ? [] : (f.default || '');
  }));
  return out;
};

// ─── UI ───────────────────────────────────────────────────────────────────────
const INPUT = 'w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-emerald-500 focus:outline-none';
const COLS = { 2: 'grid-cols-2', 3: 'grid-cols-3', 4: 'grid-cols-4' };

function StepIndicator({ steps, current }) {
  return (
    <div className="flex items-center justify-center gap-2 mb-8">
      {steps.map((s, i) => (
        <div key={s} className="flex items-center gap-2">
          <div className={`flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold
            ${i < current ? 'bg-green-500 text-white' : i === current ? 'bg-emerald-600 text-white' : 'bg-gray-200 text-gray-400'}`}>
            {i < current ? '✓' : i + 1}
          </div>
          <span className={`text-xs font-medium hidden sm:block ${i === current ? 'text-emerald-700' : 'text-gray-400'}`}>{s}</span>
          {i < steps.length - 1 && <div className={`w-8 h-0.5 ${i < current ? 'bg-green-500' : 'bg-gray-200'}`} />}
        </div>
      ))}
    </div>
  );
}

function Field({ field, form, set }) {
  const { kind, name, label, help } = field;

  if (kind === 'note') {
    return <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-xs text-blue-700">{field.text}</div>;
  }

  const labelEl = label && (
    <label className={`block text-sm font-semibold text-gray-700 ${kind === 'choice' || kind === 'multi' ? 'mb-2' : 'mb-1'}`}>
      {label}{field.required && ' *'}
    </label>
  );
  const helpEl = help && <p className="text-xs text-gray-500 mt-2">{help}</p>;

  let control;
  if (kind === 'choice') {
    control = (
      <div className={`grid ${COLS[field.cols] || 'grid-cols-3'} gap-2`}>
        {field.options.map(o => (
          <button key={o} type="button" onClick={() => set(name, form[name] === o ? '' : o)}
            className={`py-2 rounded-lg border-2 text-xs sm:text-sm font-medium transition-all ${form[name] === o
              ? 'border-emerald-500 bg-emerald-50 text-emerald-700'
              : 'border-gray-200 text-gray-600 hover:border-emerald-300'}`}>{o}</button>
        ))}
      </div>
    );
  } else if (kind === 'multi') {
    const toggle = o => set(name, form[name].includes(o) ? form[name].filter(x => x !== o) : [...form[name], o]);
    control = (
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
        {field.options.map(o => (
          <label key={o} className={`flex items-center gap-3 p-2 rounded-lg border-2 cursor-pointer transition-all ${form[name].includes(o)
            ? 'border-emerald-400 bg-emerald-50' : 'border-gray-200 hover:border-emerald-300'}`}>
            <input type="checkbox" className="accent-emerald-500" checked={form[name].includes(o)} onChange={() => toggle(o)} />
            <span className="text-sm font-medium text-gray-900">{o}</span>
          </label>
        ))}
      </div>
    );
  } else if (kind === 'select') {
    control = (
      <select className={INPUT} value={form[name]} onChange={e => set(name, e.target.value)}>
        <option value="">Select</option>
        {field.options.map(o => <option key={o}>{o}</option>)}
      </select>
    );
  } else if (kind === 'textarea') {
    control = <textarea className={`${INPUT} min-h-24`} placeholder={field.placeholder} value={form[name]} onChange={e => set(name, e.target.value)} />;
  } else {
    control = <input className={INPUT} type={field.type || (kind === 'date' ? 'date' : 'text')} placeholder={field.placeholder}
      maxLength={field.maxLength} value={form[name]} onChange={e => set(name, e.target.value)} />;
  }

  return <div>{labelEl}{control}{helpEl}</div>;
}

function SchemaForm({ schema, endpoint, source }) {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(() => defaultsFor(schema));
  const [state, setState] = useState('editing'); // editing | sending | sent | error
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  // Steps can be gated too (e.g. the Property section only when Property coverage
  // is requested), so the active list is recomputed as answers change.
  const activeSteps = schema.steps.filter(s => isVisible(s, form));
  const steps = activeSteps.map(s => s.key);
  const index = Math.min(step, activeSteps.length - 1);
  const current = activeSteps[index];
  const visible = current.fields.filter(f => isVisible(f, form));
  const isLast = index === activeSteps.length - 1;

  // mustMatch (e.g. confirmEmail must equal email), only enforced once both are filled
  const mismatches = visible.filter(f => f.mustMatch && form[f.name] && form[f.mustMatch] && form[f.name] !== form[f.mustMatch]);

  const canNext = visible.every(f => {
    if (!f.required || !f.name) return true;
    const v = form[f.name];
    return Array.isArray(v) ? v.length > 0 : !!v;
  }) && mismatches.length === 0;

  const submit = async () => {
    setState('sending');
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...form, quoteType: schema.quoteType, source, submittedAt: new Date().toISOString() }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      setState('sent');
      window.scrollTo(0, 0);
    } catch (e) {
      setState('error');
    }
  };

  if (state === 'sent') {
    const leadName = (schema.leadName || []).map(k => form[k]).find(Boolean);
    return (
      <div className="min-h-screen flex items-center justify-center px-4 py-12" style={{ background: 'linear-gradient(to bottom, #ecfdf5, white)' }}>
        <div className="max-w-lg w-full text-center bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
          <div className="text-4xl mb-4">✅</div>
          <h1 className="text-2xl font-black text-gray-900 mb-2">{schema.confirmation?.heading || 'Quote Request Received'}</h1>
          <p className="text-gray-600 text-sm mb-2">{leadName || ''}</p>
          <p className="text-gray-600 text-sm mb-6">{schema.confirmation?.body || 'Thanks — an agent will follow up shortly.'}</p>
          <a href="tel:+14055099433" className="inline-block font-bold text-emerald-700">Need it sooner? Call (405) 509-9433</a>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen py-10 px-4" style={{ background: 'linear-gradient(to bottom, #ecfdf5, white)' }}>
      <div className="max-w-2xl mx-auto">
        <div className="text-center mb-6">
          <div className="inline-flex items-center gap-2 text-white px-4 py-2 rounded-full text-sm font-semibold mb-3" style={{ background: schema.accent || '#059669' }}>
            {schema.badge || schema.label}
          </div>
          <h1 className="text-2xl font-black text-gray-900">{schema.heading || schema.label}</h1>
          {schema.subheading && <p className="text-gray-500 text-sm mt-1">{schema.subheading}</p>}
        </div>

        <StepIndicator steps={steps} current={index} />

        <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-8 fade-in">
          <h2 className="text-lg font-bold text-gray-900 mb-1">{current.title}</h2>
          {current.intro && <p className="text-sm text-gray-500 mb-4">{current.intro}</p>}

          <div className="space-y-5">
            {(() => {
              // Group consecutive half/third fields into one row.
              const rows = [];
              visible.forEach(f => {
                const width = f.half ? 2 : f.third ? 3 : 1;
                const last = rows[rows.length - 1];
                if (width > 1 && last && last.width === width && last.items.length < width) last.items.push(f);
                else rows.push({ width, items: [f] });
              });
              return rows.map((row, i) => row.width === 1
                ? <Field key={i} field={row.items[0]} form={form} set={set} />
                : (
                  <div key={i} className={`grid ${COLS[row.width]} gap-4`}>
                    {row.items.map(f => <Field key={f.name} field={f} form={form} set={set} />)}
                  </div>
                ));
            })()}
            {mismatches.map(f => (
              <p key={f.name} className="text-xs text-red-600">{f.label} doesn't match {(current.fields.find(x => x.name === f.mustMatch) || {}).label || f.mustMatch}.</p>
            ))}
            {state === 'error' && (
              <p className="text-sm text-red-600">
                We couldn't submit the form. Please try again, or call (405) 509-9433 and we'll take the details by phone.
              </p>
            )}
          </div>

          <div className="flex items-center justify-between mt-8 pt-6 border-t border-gray-100">
            {index > 0
              ? <button onClick={() => setStep(index - 1)} className="text-sm text-gray-500 hover:text-gray-700 font-medium">← Back</button>
              : <div />}
            <button
              onClick={() => { if (!isLast) { setStep(index + 1); window.scrollTo(0, 0); } else submit(); }}
              disabled={!canNext || state === 'sending'}
              className={`px-6 py-3 rounded-xl font-semibold text-sm transition-all ${canNext && state !== 'sending'
                ? 'text-white shadow-md hover:opacity-90' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
              style={canNext && state !== 'sending' ? { background: schema.accent || '#059669' } : {}}>
              {state === 'sending' ? 'Submitting…' : isLast ? 'Submit Quote Request' : 'Continue →'}
            </button>
          </div>
        </div>
        <p className="text-center text-xs text-gray-400 mt-4">🔒 Secure &amp; confidential · Licensed Oklahoma insurance broker · OKCInsuranceBrokers.com</p>
      </div>
    </div>
  );
}

function App() {
  const [state, setState] = useState({ status: 'loading' });

  useEffect(() => {
    loadConfig().then(loaded => {
      if (!loaded) {
        setState({ status: 'error', message: `No schema-driven form '${FORM_ID}' in ${CONFIG_URL} or the embedded config.` });
        return;
      }
      const { config, from } = loaded;
      const schema = findForm(config, FORM_ID);
      const endpoint = params.get('endpoint') || schema.endpoint || config.endpoint || '/api/quote';
      const source = params.get('source') || schema.source || `agency-crm/forms/${schema.id}`;
      console.info(`[${FORM_ID}] schema loaded from ${from}, posting to ${endpoint}`);
      setState({ status: 'ready', schema, endpoint, source });
    });
  }, []);

  if (state.status === 'loading') {
    return <p className="text-center py-16 text-gray-400 text-sm">Loading form…</p>;
  }
  if (state.status === 'error') {
    return (
      <div className="max-w-lg mx-auto text-center py-16 px-4">
        <p className="text-red-600 text-sm font-medium mb-2">Couldn't load the form configuration.</p>
        <p className="text-gray-500 text-xs mb-6">{state.message}</p>
        <a href="tel:+14055099433" className="font-bold text-emerald-700 text-sm">Call (405) 509-9433 and we'll take the details by phone</a>
      </div>
    );
  }
  return <SchemaForm schema={state.schema} endpoint={state.endpoint} source={state.source} />;
}

ReactDOM.createRoot(document.getElementById('form-root')).render(<App />);
</script>
</body>
</html>
