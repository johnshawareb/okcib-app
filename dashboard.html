<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKCIB Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .slide-in { animation: slideIn .3s ease-out; }
    @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<!-- Header -->
<header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="bg-blue-600 rounded-lg p-2">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div>
      <div class="font-black text-white text-lg">OKCIB</div>
      <div class="text-xs text-gray-400 -mt-1">Quote Agent Dashboard</div>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <span id="status-dot" class="w-2 h-2 rounded-full bg-green-500"></span>
    <span id="status-text" class="text-xs text-gray-400">Server online</span>
    <a href="/" class="text-xs bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg transition-colors">← Public Site</a>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-8">

  <!-- Stats bar -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
    <div id="stat-total" class="bg-gray-900 rounded-xl p-4 border border-gray-800">
      <div class="text-2xl font-black text-white" id="s-total">—</div>
      <div class="text-xs text-gray-400 mt-1">Total Leads</div>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
      <div class="text-2xl font-black text-green-400" id="s-complete">—</div>
      <div class="text-xs text-gray-400 mt-1">Quoted</div>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
      <div class="text-2xl font-black text-yellow-400" id="s-pending">—</div>
      <div class="text-xs text-gray-400 mt-1">Pending</div>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
      <div class="text-2xl font-black text-blue-400" id="s-today">—</div>
      <div class="text-xs text-gray-400 mt-1">Today</div>
    </div>
  </div>

  <div class="grid lg:grid-cols-5 gap-6">

    <!-- Submissions list -->
    <div class="lg:col-span-2">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-white">Quote Requests</h2>
        <button onclick="loadSubmissions()" class="text-xs text-gray-400 hover:text-white transition-colors">↻ Refresh</button>
      </div>
      <div id="submissions-list" class="space-y-2">
        <div class="text-gray-500 text-sm text-center py-8">Loading...</div>
      </div>
    </div>

    <!-- Detail / Agent panel -->
    <div class="lg:col-span-3">
      <div id="detail-panel" class="bg-gray-900 rounded-2xl border border-gray-800 p-6 min-h-64">
        <div class="text-center text-gray-500 py-12">
          <svg class="w-12 h-12 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <p class="text-sm">Select a quote request to view details and run the agent</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let selectedId = null;
let eventSource = null;
let formSchemas = {};   // quoteType -> schema from agency-crm/forms/forms.config.json

// Detail panels for schema-driven forms are rendered from the same config the form
// uses, so new questions show up here without touching this file.
async function loadFormSchemas() {
  try {
    const res = await fetch('/agency-crm/forms/forms.config.json');
    if (!res.ok) return;
    const config = await res.json();
    (config.forms || []).forEach(f => { if (f.steps) formSchemas[f.quoteType] = f; });
  } catch (e) { /* detail panel falls back to generic rendering */ }
}

// ─── Load submissions ─────────────────────────────────────────────────────────
async function loadSubmissions() {
  try {
    const res = await fetch('/api/quotes');
    const subs = await res.json();

    const today = new Date().toDateString();
    document.getElementById('s-total').textContent = subs.length;
    document.getElementById('s-complete').textContent = subs.filter(s => s.status === 'complete').length;
    document.getElementById('s-pending').textContent = subs.filter(s => s.status === 'pending').length;
    document.getElementById('s-today').textContent = subs.filter(s => new Date(s.createdAt).toDateString() === today).length;

    const list = document.getElementById('submissions-list');
    if (subs.length === 0) {
      list.innerHTML = '<div class="text-gray-500 text-sm text-center py-8">No submissions yet.<br>Fill out the quote form on the public site.</div>';
      return;
    }

    list.innerHTML = subs.map(s => {
      const isHOA = s.data.quoteType === 'hoa';
      const name = isHOA
        ? (s.data.associationName || s.data.contactName || 'Unknown Association')
        : (s.data.name || `${s.data.firstName || ''} ${s.data.lastName || ''}`.trim() || 'Unknown');
      const type = isHOA ? '🏢' : (s.data.quoteType === 'home' || s.data.coverageType === 'home') ? '🏠' : '🚗';
      const statusColor = { pending: 'text-yellow-400', running: 'text-blue-400 pulse', complete: 'text-green-400', error: 'text-red-400' }[s.status] || 'text-gray-400';
      const statusLabel = { pending: 'Pending', running: 'Agent Running...', complete: 'Quoted', error: 'Error' }[s.status] || s.status;
      const isSelected = s.id === selectedId;
      return `
        <button onclick="selectSubmission('${s.id}')"
          class="w-full text-left p-4 rounded-xl border transition-all slide-in ${isSelected ? 'border-blue-500 bg-blue-950' : 'border-gray-800 bg-gray-900 hover:border-gray-600'}">
          <div class="flex items-center justify-between mb-1">
            <span class="font-semibold text-sm text-white">${type} ${name}</span>
            <span class="text-xs ${statusColor}">${statusLabel}</span>
          </div>
          <div class="text-xs text-gray-500">${s.data.locationZip || s.data.zip || ''} · ${new Date(s.createdAt).toLocaleDateString()} ${new Date(s.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
          ${s.quotes && s.quotes.length > 0 ? `<div class="text-xs text-green-400 mt-1">${s.quotes.filter(q=>q.success).length} quote${s.quotes.filter(q=>q.success).length!==1?'s':''} obtained</div>` : ''}
        </button>`;
    }).join('');
  } catch (e) {
    document.getElementById('submissions-list').innerHTML = '<div class="text-red-400 text-sm text-center py-8">Cannot connect to server.<br>Make sure <code>node server.js</code> is running.</div>';
    document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-red-500';
    document.getElementById('status-text').textContent = 'Server offline';
  }
}

// ─── Select a submission ──────────────────────────────────────────────────────
async function selectSubmission(id) {
  selectedId = id;
  loadSubmissions(); // refresh selection highlight

  const res = await fetch(`/api/quotes/${id}`);
  const sub = await res.json();
  renderDetail(sub);
}

function renderDetail(sub) {
  const d = sub.data;
  const isHOA = d.quoteType === 'hoa';
  const name = isHOA
    ? (d.associationName || d.contactName || 'Unknown Association')
    : (d.name || `${d.firstName || ''} ${d.lastName || ''}`.trim() || 'Unknown');
  const cell = (label, value) => value ? `<div class="bg-gray-800 rounded-lg p-3"><div class="text-xs text-gray-400">${label}</div><div class="text-sm text-white font-medium">${value}</div></div>` : '';
  const listOf = (v) => Array.isArray(v) && v.length ? v.join(', ') : '';
  const filled = v => Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null && String(v).trim() !== '';

  // Schema-driven sections: one block per step, answered questions only.
  const schema = formSchemas[d.quoteType];
  const schemaHtml = !schema ? '' : schema.steps.map(step => {
    const answered = step.fields.filter(f => f.name && filled(d[f.name]));
    if (!answered.length) return '';
    return `
      <div class="mb-4">
        <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">${step.title}</h4>
        <div class="space-y-1.5">
          ${answered.map(f => `
            <div class="bg-gray-800 rounded-lg px-3 py-2">
              <div class="text-xs text-gray-400">${f.label}</div>
              <div class="text-sm text-white font-medium">${listOf(d[f.name]) || d[f.name]}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');

  const carrierColors = {
    'Progressive': '#0066CC', 'GEICO': '#00843D', 'Mercury': '#C8202F',
    'Root': '#FF5733', 'Liberty Mutual': '#003DA5'
  };

  const quotesHtml = sub.quotes && sub.quotes.length > 0 ? `
    <div class="mt-4">
      <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Quotes Obtained</h4>
      <div class="space-y-2">
        ${sub.quotes.map(q => `
          <div class="rounded-xl p-3 border ${q.success ? 'border-green-800 bg-green-950' : 'border-gray-700 bg-gray-800'}">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm" style="color:${carrierColors[q.carrier]||'#fff'}">${q.carrier}</span>
              ${q.success ? `<span class="text-green-400 font-bold text-sm">${q.quote || 'Quote obtained'}</span>` : `<span class="text-red-400 text-xs">${q.error || 'Error'}</span>`}
            </div>
            ${q.notes ? `<div class="text-xs text-gray-400 mt-1">${q.notes}</div>` : ''}
            ${q.loginUrl ? `<a href="${q.loginUrl}" target="_blank" class="text-xs text-blue-400 hover:underline mt-1 block">→ Open portal to log in</a>` : ''}
          </div>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('detail-panel').innerHTML = `
    <div class="slide-in">
      <div class="flex items-start justify-between mb-5">
        <div>
          <h3 class="text-lg font-bold text-white">${name}</h3>
          <div class="text-xs text-gray-400 mt-0.5">${isHOA && d.contactName ? `${d.contactName}${d.contactTitle || d.contactRole ? ` (${d.contactTitle || d.contactRole})` : ''} · ` : ''}${d.email || ''} · ${d.phone || ''} · ${d.locationZip || d.zip || ''}</div>
        </div>
        <span class="text-xs px-2 py-1 rounded-full bg-gray-800 text-gray-300 capitalize">${sub.status}</span>
      </div>

      ${schemaHtml}

      <!-- Customer info -->
      <div class="grid grid-cols-2 gap-3 mb-4">
        ${d.year ? `<div class="bg-gray-800 rounded-lg p-3"><div class="text-xs text-gray-400">Vehicle</div><div class="text-sm text-white font-medium">${d.year} ${d.make} ${d.model}</div></div>` : ''}
        ${d.coverageType ? `<div class="bg-gray-800 rounded-lg p-3"><div class="text-xs text-gray-400">Coverage</div><div class="text-sm text-white font-medium capitalize">${d.coverageType}</div></div>` : ''}
        ${d.dob ? `<div class="bg-gray-800 rounded-lg p-3"><div class="text-xs text-gray-400">Date of Birth</div><div class="text-sm text-white font-medium">${d.dob}</div></div>` : ''}
        ${d.incidents ? `<div class="bg-gray-800 rounded-lg p-3"><div class="text-xs text-gray-400">Prior Incidents</div><div class="text-sm text-white font-medium">${d.incidents}</div></div>` : ''}
        ${!isHOA && d.currentCarrier ? `<div class="bg-gray-800 rounded-lg p-3"><div class="text-xs text-gray-400">Current Carrier</div><div class="text-sm text-white font-medium">${d.currentCarrier}</div></div>` : ''}
        ${d.deductible ? `<div class="bg-gray-800 rounded-lg p-3"><div class="text-xs text-gray-400">Deductible</div><div class="text-sm text-white font-medium">$${d.deductible}</div></div>` : ''}
      </div>

      ${!schema && d.notes ? `<div class="bg-gray-800 rounded-lg p-3 mb-4"><div class="text-xs text-gray-400 mb-1">Notes</div><div class="text-sm text-gray-300">${d.notes}</div></div>` : ''}

      <!-- Agent log -->
      <div id="agent-log" class="bg-gray-950 rounded-xl border border-gray-800 p-3 mb-4 min-h-16 max-h-48 overflow-y-auto text-xs font-mono space-y-1 hidden"></div>

      ${quotesHtml}

      <!-- Actions -->
      <div class="flex gap-2 mt-5">
        <button onclick="copyData('${sub.id}')"
          class="flex-1 bg-gray-800 hover:bg-gray-700 text-white px-4 py-3 rounded-xl transition-all text-sm font-semibold">
          📋 Copy Customer Info
        </button>
      </div>
      <div class="mt-3 text-xs text-gray-500 text-center">
        Quote agent available via Claude Code — ask Claude to run it for this submission
      </div>
    </div>`;
}

// ─── Run the quote agent ──────────────────────────────────────────────────────
async function runAgent(id) {
  const log = document.getElementById('agent-log');
  log.classList.remove('hidden');
  log.innerHTML = '';

  // Start SSE stream BEFORE triggering the agent
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`/api/agent/stream/${id}`);

  eventSource.onmessage = (e) => {
    const event = JSON.parse(e.data);
    const color = {
      start: 'text-blue-400', progress: 'text-gray-300', quote: event.success ? 'text-green-400' : 'text-red-400',
      skip: 'text-gray-500', done: 'text-green-400', error: 'text-red-400'
    }[event.type] || 'text-gray-400';

    const carrier = event.carrier ? `[${event.carrier}] ` : '';
    const msg = event.message || event.quote || event.error || '';

    log.innerHTML += `<div class="${color}">${carrier}${msg}</div>`;
    log.scrollTop = log.scrollHeight;

    if (event.type === 'done' || event.type === 'error') {
      eventSource.close();
      setTimeout(() => {
        loadSubmissions();
        selectSubmission(id);
      }, 1000);
    }
  };

  // Trigger agent
  await fetch(`/api/agent/quote/${id}`, { method: 'POST' });
  loadSubmissions();
}

// ─── Copy customer data ───────────────────────────────────────────────────────
async function copyData(id) {
  const res = await fetch(`/api/quotes/${id}`);
  const sub = await res.json();
  const d = sub.data;
  const text = [
    `Name: ${d.name || `${d.firstName || ''} ${d.lastName || ''}`.trim()}`,
    `DOB: ${d.dob || ''}`,
    `Phone: ${d.phone || ''}`,
    `Email: ${d.email || ''}`,
    `Address: ${d.address || ''}, ${d.city || ''}, OK ${d.zip || ''}`,
    `Vehicle: ${d.year || ''} ${d.make || ''} ${d.model || ''}`,
    `VIN: ${d.vin || 'not provided'}`,
    `Coverage: ${d.coverageType || ''}`,
    `Deductible: $${d.deductible || ''}`,
    `Incidents: ${d.incidents || 'None'}`,
    `Current Carrier: ${d.currentCarrier || 'none'}`,
    d.notes ? `Notes: ${d.notes}` : '',
  ].filter(Boolean).join('\n');
  await navigator.clipboard.writeText(text);
  alert('Customer data copied to clipboard!');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
loadFormSchemas().then(loadSubmissions);
setInterval(loadSubmissions, 15000); // auto-refresh every 15s
</script>
</body>
</html>
