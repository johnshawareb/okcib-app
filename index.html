// ─── ROUTER ──────────────────────────────────────────────────────────────────
function useRoute() {
  const [page, setPage] = useState(() => {
    const h = window.location.hash.replace('#','') || '/';
    return h;
  });
  const navigate = (to) => {
    window.location.hash = to;
    setPage(to);
    window.scrollTo(0, 0);
  };
  useEffect(() => {
    const handler = () => {
      const h = window.location.hash.replace('#','') || '/';
      setPage(h);
      window.scrollTo(0, 0);
    };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  return { page, navigate };
}

// ─── STEP INDICATOR ───────────────────────────────────────────────────────────
function StepIndicator({ steps, current, color = 'blue' }) {
  const activeColor = color === 'blue' ? '#1a1a4a' : undefined;
  return (
    <div className="flex items-center justify-center gap-2 mb-8">
      {steps.map((s, i) => (
        <div key={s} className="flex items-center gap-2">
          <div className={`flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold transition-all
            ${i < current ? 'bg-green-500 text-white' : i === current ? (activeColor ? 'text-white' : `bg-${color}-600 text-white`) : 'bg-gray-200 text-gray-400'}`}
            style={i === current && activeColor ? {background: activeColor} : {}}>
            {i < current ? <CheckIcon size={14} className="text-white" /> : i + 1}
          </div>
          <span className={`text-xs font-medium hidden sm:block ${i === current ? (activeColor ? '' : `text-${color}-600`) : 'text-gray-400'}`}
            style={i === current && activeColor ? {color: activeColor} : {}}>{s}</span>
          {i < steps.length - 1 && <div className={`w-8 h-0.5 ${i < current ? 'bg-green-500' : 'bg-gray-200'}`} />}
        </div>
      ))}
    </div>
  );
}

              <div><label className={lbl}>Preferred Contact Method</label>
                <div className="grid grid-cols-4 gap-2">
                  {['Call','Text','Email','Email & Call'].map(v=>(

              </div>

                  <select className={sel} value={form.howHeard} onChange={e=>set('howHeard',e.target.value)}>

                    <option>Google</option><option>ChatGPT / AI</option><option>Referral</option>
                    <option>Facebook</option><option>Yahoo</option><option>Other</option>
                  </select></div>

                      <input type="checkbox" className="accent-blue-600" checked={form.additionalProducts.includes(p)} onChange={()=>toggleProduct(p)} />{p}
                    </label>
                  ))}
                </div>
              </div>
              <div><label className={lbl}>Notes / Additional Vehicles</label>
                <textarea className={`${inp} resize-none`} rows={3} placeholder="SR-22, teen driver, additional vehicles, other notes..." value={form.notes} onChange={e=>set('notes',e.target.value)} /></div>

                <label className={lbl}>Upload Current/Old Policy <span className="text-gray-400 font-normal">(optional)</span></label>

                  {form.policyFile ? (
                    <div className="text-center">
                      <div className="text-2xl mb-1">📄</div>
                      <div className="text-sm font-semibold text-blue-600">{form.policyFile.name}</div>
                      <div className="text-xs text-gray-400">{(form.policyFile.size/1024).toFixed(0)} KB</div>
                    </div>
                  ) : (
                    <div className="text-center text-gray-400">
                      <div className="text-2xl mb-1">📎</div>
                      <div className="text-sm">Click to upload your current policy</div>
                      <div className="text-xs mt-0.5">PDF, JPG, PNG accepted</div>
                    </div>
                  )}
                </label>
              </div>
              <div className="rounded-xl p-4 text-xs text-gray-600" style={{background:'#f0f0f9'}}>
                By submitting, you agree to be contacted by OKC Insurance Brokers. We never sell your information.
              </div>
            </div>
          )}

          <div className="flex items-center justify-between mt-8 pt-6 border-t border-gray-100">
            {step>0 ? (
              <button onClick={()=>setStep(s=>s-1)} className="flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 font-medium">
                <ChevronLeftIcon size={16} /> Back
              </button>
            ) : <div/>}
            <button
              onClick={async ()=>{ if(step<steps.length-1){ setStep(s=>s+1); window.scrollTo(0,0); } else { try{ const fd=new FormData(); const {policyFile,...data}=form; fd.append('data',JSON.stringify({...data,quoteType:'auto'})); if(policyFile) fd.append('policy',policyFile); await fetch('/api/quote',{method:'POST',body:fd}); }catch(e){} navigate('/thank-you?type=auto'); } }}
              disabled={!canNext()}
              className={`flex items-center gap-2 px-6 py-3 rounded-xl font-semibold text-sm transition-all ${canNext()?'text-white shadow-md':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
              style={canNext()?{background:'#2563eb'}:{}}
            >
              {step===steps.length-1 ? 'Submit Quote Request' : 'Continue'}
              <ChevronRightIcon size={16} />
            </button>
          </div>
        </div>
        <p className="text-center text-xs text-gray-400 mt-4">🔒 Secure & confidential · Licensed Oklahoma insurance broker · OKCInsuranceBrokers.com</p>
      </div>
    </div>
  );
}

    prevAddress:'', prevAddress2:'', prevCity:'', prevState:'', prevZip:'',

    homeType:'', yearBuilt:'', stories:'',
    roofAge:'', roofMaterial:'', hailResistant:'',
    occupationOne:'', occupationTwo:'',
    hasPool:'', hasDogs:'', hasLosses:'', lossTypes:[],
    propertyOwnership:'', hasMortgage:'', shortTermRental:'', rentalDuration:'',
    // Coverage
    dwellingCoverage:'', standardDeductible:'', windHailDeductible:'',
    personalProperty:false, waterBackup:false, scheduledProperty:false, tornado:false,
    discounts:[], insuranceProducts:[], currentCoverage:'', policyStartDate:'',

    email:'', confirmEmail:'', phone:'',
    heardAboutUs:'', contactPreference:'', textOptIn:'', policyUpload:null,

  const canNext = () => {
    if (step===0) return form.firstName && form.lastName && form.dob;
    if (step===1) return form.address && form.city && form.zip;
    if (step===2) return form.homeType && form.yearBuilt && form.occupationOne;
    if (step===3) return form.dwellingCoverage && form.standardDeductible && form.currentCoverage && form.policyStartDate;

              <div className="grid grid-cols-2 gap-4">
                <div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">ZIP Code *</label>

              </div>
              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-2">Ownership Status</label>
                <div className="grid grid-cols-2 gap-2">

                    <button key={o} type="button"
                      className={`py-2.5 rounded-lg border-2 text-sm font-medium transition-all ${form.ownership===o?'border-yellow-500 bg-yellow-50 text-yellow-700':'border-gray-200 text-gray-600 hover:border-yellow-300'}`}
                      onClick={()=>set('ownership',o)}>{o}</button>

              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-1">Confirm Email *</label>

              </div>
              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-2">Preferred Contact Method *</label>

              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-1">Phone Number *</label>
                <input type="tel" className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 focus:outline-none" placeholder="(405) 555-0100" value={form.phone} onChange={e=>set('phone',e.target.value)} />

              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-2">Opt in to text messages?</label>
                <div className="flex gap-2">
                  {['Yes','No'].map(v=>(
                    <button key={v} type="button"
                      className={`flex-1 py-2 rounded-lg border-2 text-sm font-medium transition-all ${form.textOptIn===v?'border-yellow-500 bg-yellow-50 text-yellow-700':'border-gray-200 text-gray-600 hover:border-yellow-300'}`}

                  ))}
                </div>
              </div>
              <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-xs text-blue-700">

              </div>
            </div>
          )}

          <div className="flex items-center justify-between mt-8 pt-6 border-t border-gray-100">
            {step>0 ? (
              <button onClick={()=>setStep(s=>s-1)} className="flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 font-medium">
                <ChevronLeftIcon size={16} /> Back
              </button>
            ) : <div/>}
            <button
              onClick={async ()=>{ if(step<steps.length-1){ setStep(s=>s+1); window.scrollTo(0,0); } else { try{ await fetch('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...form,quoteType:'home'})}); }catch(e){} navigate('/thank-you?type=home'); } }}
              disabled={!canNext()}
              className={`flex items-center gap-2 px-6 py-3 rounded-xl font-semibold text-sm transition-all ${canNext()?'bg-yellow-500 hover:bg-yellow-600 text-white shadow-md':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
            >
              {step===steps.length-1 ? 'Submit Quote Request' : 'Continue'}
              <ChevronRightIcon size={16} />
            </button>
          </div>
        </div>
        <p className="text-center text-xs text-gray-400 mt-4">🔒 Secure & confidential · Licensed Oklahoma insurance broker · OKCInsuranceBrokers.com</p>
      </div>
    </div>

}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const { page, navigate } = useRoute();
  const renderPage = () => {
    if (page.startsWith('/auto-quote')) return <AutoQuotePage navigate={navigate} />;
    if (page.startsWith('/home-quote')) return <HomeQuotePage navigate={navigate} />;
    if (page.startsWith('/about')) return <AboutPage navigate={navigate} />;
    if (page.startsWith('/thank-you')) return <ThankYouPage navigate={navigate} page={page} />;
    return <HomePage navigate={navigate} />;
  };
  return (
    <div className="min-h-screen flex flex-col">
      <Navbar navigate={navigate} page={page} />
      <main className="flex-1">{renderPage()}</main>
      <Footer navigate={navigate} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
